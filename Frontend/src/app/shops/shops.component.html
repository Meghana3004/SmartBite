<div class="min-h-screen bg-white font-inter p-4 sm:p-6 md:p-8 flex flex-col items-center">
  <div class="w-full max-w-6xl">
    <app-header></app-header>
  </div>

  <main class="w-full max-w-6xl flex flex-col items-center space-y-8">
    <div class="text-center mb-8">
      <h1 class="text-4xl sm:text-5xl font-bold text-gray-800 mb-2 tracking-tight">Choose Your Restaurant</h1>
      <p class="text-gray-600 text-lg">Discover delicious food from our partner restaurants</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full">
      <div *ngFor="let shop of shops" class="group bg-white backdrop-blur-sm rounded-3xl shadow-xl hover:shadow-2xl transition-all duration-500 ease-out overflow-hidden hover:scale-105 border border-gray-200">
        <div class="relative h-48 bg-gradient-to-br from-orange-100 to-yellow-100 overflow-hidden flex items-center justify-center">
          <img *ngIf="shop.imageUrl" [src]="shop.imageUrl" [alt]="shop.name" class="object-cover w-full h-full" />
          <div *ngIf="!shop.imageUrl" class="w-32 h-24 bg-gradient-to-br from-orange-200 to-yellow-200 rounded-xl flex items-center justify-center shadow-lg">
            <span class="text-4xl">🍽️</span>
          </div>
          <button class="absolute top-4 right-4 p-2 bg-white/80 backdrop-blur-sm rounded-full shadow-lg hover:bg-white transition-all duration-300 hover:scale-110">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-gray-600 hover:text-red-500">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
            </svg>
          </button>
        </div>
        <div class="p-6">
          <h3 class="text-xl font-bold text-gray-800 mb-2 group-hover:text-green-600 transition-colors duration-300">{{ shop.name }}</h3>
          <div class="flex items-center space-x-4 mb-3">
            <div class="flex items-center space-x-1">
              <div class="w-3 h-3 bg-green-500 rounded-full"></div>
              <span class="text-sm font-semibold text-gray-700">{{ shop.rating }}</span>
            </div>
            <span class="text-gray-400">•</span>
            <span class="text-sm text-gray-600 font-medium">Avg {{ shop.avgPrice }}</span>
          </div>
          <p class="text-gray-600 text-sm mb-4">{{ shop.description }}</p>
          <p class="text-gray-500 text-xs">{{ shop.address }}</p>
          <button (click)="navigateToMenu(shop)" style="background:linear-gradient(90deg, #3DCD58, #2E8B3E)" class="w-full mt-4 text-white py-3 rounded-xl font-semibold hover:from-green-600 hover:to-emerald-600 transition-all duration-300 hover:scale-105 active:scale-95 shadow-lg hover:shadow-xl">
            Order Now
          </button>
        </div>
      </div>
    </div>

    <div class="mt-12 text-center">
      <button class="bg-gray-100 hover:bg-gray-200 text-gray-800 px-8 py-3 rounded-xl border border-gray-300 transition-all duration-300 hover:scale-105 active:scale-95 font-semibold shadow-lg">
        Load More Restaurants
      </button>
    </div>
  </main>
</div>
